<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Viajes | Agencia de Buses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/index.html"><i class="bi bi-bus-front"></i> AgenciaBus Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/index.html">Buses</a></li>
                    <li class="nav-item"><a class="nav-link" href="/rutas.html">Rutas</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/viajes.html">Viajes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/personal.html">Personal</a></li>
                    <li class="nav-item"><a class="nav-link" href="/reportes.html">Reportes</a></li>
                </ul>
                <button class="btn btn-outline-light btn-sm" id="btnCerrarSesion">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <h2 class="fw-bold mb-4">Programación de Viajes</h2>
        <p id="mensaje" role="status" class="text-center"></p>

        <!-- Formulario (Fila Superior) -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <form id="formulario" class="row g-3 align-items-end">
                    <input type="hidden" id="id">
                    
                    <div class="col-md-2">
                        <label class="form-label">Ruta</label>
                        <select id="ruta" class="form-select" required></select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Bus</label>
                        <select id="bus" class="form-select" required></select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Chofer</label>
                        <select id="chofer" class="form-select" required></select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Fecha</label>
                        <input type="date" id="fecha" class="form-control" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Hora</label>
                        <input type="time" id="hora" class="form-control" required>
                    </div>
                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" id="btnGuardar" class="btn btn-primary w-100">Programar</button>
                        <button type="button" id="btnCancelar" class="btn btn-secondary w-100" hidden>Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla -->
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Ruta</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Bus</th>
                            <th>Chofer</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody id="tabla"></tbody>
                    </table>
                </div>
            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/viajes.js"></script>
    <script>
        document.getElementById('btnCerrarSesion').addEventListener('click', () => {
            sessionStorage.removeItem('token');
            window.location.href = '/login.html';
        });
    </script>
</body>
</html>
