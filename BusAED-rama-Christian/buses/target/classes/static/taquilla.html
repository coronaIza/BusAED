<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taquilla | Agencia de Buses</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    #mapaAsientos { display: grid; grid-template-columns: repeat(10, 38px); gap: 6px; justify-content: start; }
    #mapaAsientos .asiento-t { width:38px; height:34px; padding:0; border:1px solid #b7c8d6; border-radius:6px; background:#eaf6ea; }
    #mapaAsientos .asiento-t.ocupado { background:#dc3545; color:white; cursor:not-allowed; }
    #mapaAsientos .asiento-t.seleccionado { background:#0d6efd; color:white; }
    @media(max-width:576px) { #mapaAsientos { grid-template-columns:repeat(5,38px); } }
  </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary shadow-sm">
  <div class="container"><a class="navbar-brand fw-bold" href="#"><i class="bi bi-shop"></i> Portal de Taquilla</a><button id="btnSalir" class="btn btn-outline-light btn-sm">Cerrar sesión</button></div>
</nav>
<main class="container my-4">
  <div id="mensaje" class="alert d-none" role="status"></div>
  <div class="row g-4">
    <section class="col-lg-8">
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-header bg-dark text-white fw-bold">Venta presencial</div>
        <div class="card-body row g-3">
          <div class="col-md-6"><label class="form-label">Cliente</label><input id="cliente" class="form-control" required></div>
          <div class="col-md-6"><label class="form-label">Viaje</label><select id="viaje" class="form-select"></select></div>
          <div class="col-md-12"><label class="form-label">Asiento</label><div id="mapaAsientos" aria-label="Mapa de asientos disponibles"></div><input id="asiento" type="hidden"></div>
          <div class="col-md-6">
            <label class="form-label">Método de pago</label>
            <select id="metodoPago" class="form-select">
              <option value="EFECTIVO">Efectivo</option>
              <option value="TARJETA">Tarjeta</option>
              <option value="PENDIENTE">Pago Pendiente / App</option>
            </select>
          </div>

          <div class="col-md-6 d-none" id="grupoCorreo">
            <label class="form-label">Correo electrónico (para la App)</label>
            <input id="correoCliente" type="email" class="form-control" placeholder="usuario@correo.com">
          </div>
          <div class="col-md-4"><label class="form-label">Total</label><input id="total" type="number" min="0.01" step="0.01" class="form-control"></div>
          <div class="col-md-4 d-flex align-items-end"><button id="btnVender" class="btn btn-primary w-100"><i class="bi bi-cash"></i> Registrar venta</button></div>
        </div>
      </div>
      <div class="card border-0 shadow-sm mb-4 overflow-hidden">
        <div class="card-header bg-dark text-white fw-bold py-3"><i class="bi bi-box-seam me-2"></i> Registrar encomienda</div>
        <div class="card-body">
          <form id="formEncomienda" class="row g-3">
            <div class="col-md-6"><label for="remitente" class="form-label">Remitente</label><input id="remitente" class="form-control" placeholder="Nombre del remitente" required></div>
            <div class="col-md-6"><label for="destinatario" class="form-label">Destinatario</label><input id="destinatario" class="form-control" placeholder="Nombre del destinatario" required></div>
            <div class="col-md-4"><label for="origen" class="form-label">Origen</label><input id="origen" class="form-control" placeholder="Ciudad de origen" required></div>
            <div class="col-md-4"><label for="destino" class="form-label">Destino</label><input id="destino" class="form-control" placeholder="Ciudad de destino" required></div>
            <div class="col-md-4"><label for="telefono" class="form-label">Teléfono destinatario</label><input id="telefono" type="tel" class="form-control" placeholder="Número de contacto"></div>
            <div class="col-md-4"><label for="pesoKg" class="form-label">Peso (kg)</label><input id="pesoKg" type="number" min="0.01" step="0.01" class="form-control" placeholder="0.00" required></div>
            <div class="col-md-4"><label for="precio" class="form-label">Precio (S/)</label><div class="input-group"><span class="input-group-text">S/</span><input id="precio" type="number" min="0.01" step="0.01" class="form-control" placeholder="0.00" required></div></div>
            <div class="col-md-4">
              <label class="form-label">Método de pago</label>
              <select id="metodoPagoEncomienda" class="form-select">
                <option value="EFECTIVO">Efectivo</option>
                <option value="TARJETA">Tarjeta</option>
                <option value="PENDIENTE">Pago Pendiente / App</option>
              </select>
            </div>
            <div class="col-md-6 d-none" id="grupoCorreoEncomienda">
              <label class="form-label">Correo electrónico (para la App)</label>
              <input id="correoEncomienda" type="email" class="form-control" placeholder="usuario@correo.com">
            </div>
            <div class="col-md-4"><label for="descripcion" class="form-label">Contenido</label><textarea id="descripcion" class="form-control" rows="1" placeholder="Descripción breve"></textarea></div>
            <div class="col-12 d-flex justify-content-end"><button class="btn btn-success px-4"><i class="bi bi-plus-circle me-1"></i> Registrar encomienda</button></div>
          </form>
          <div id="listaEncomiendas" class="list-group mt-3"></div>
        </div>
      </div>
    </section>
    <aside class="col-lg-4">
      <div class="card border-0 shadow-sm mb-4"><div class="card-header fw-bold">Disponibilidad</div><div class="card-body" id="disponibilidad">Seleccione un viaje.</div></div>
      <div class="card border-0 shadow-sm"><div class="card-header fw-bold">Operaciones recientes</div><div class="list-group list-group-flush" id="operacionesRecientes"></div></div>
    </aside>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/taquilla.js"></script>
<!-- Modal de Comprobante / Registro -->
<div class="modal fade" id="modalComprobante" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div id="modalHeader" class="modal-header bg-success text-white">
        <h5 class="modal-title" id="lblModalTitulo"><i class="bi bi-check-circle-fill"></i> ¡Registro Exitoso!</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body p-4">
        <div class="text-center mb-3">
          <span class="badge bg-secondary fs-6 mb-2">Comprobante Oficial</span>
          <h4 id="lblComprobanteCodigo" class="fw-bold text-dark font-monospace">-</h4>
        </div>
        <hr>
        <div class="row g-2 text-secondary">
          <!-- Campo dinámico para Cliente o Remitente -->
          <div class="col-6" id="lblTituloPersona"><strong>Cliente:</strong></div>
          <div class="col-6 text-end text-dark fw-semibold" id="lblComprobanteCliente">-</div>

          <!-- Campo dinámico para Asiento o Descripción de Encomienda -->
          <div class="col-6" id="lblTituloDetalle"><strong>Asiento Asignado:</strong></div>
          <div class="col-6 text-end text-dark fw-semibold" id="lblComprobanteDetalle">-</div>

          <div class="col-6"><strong>Ruta (Origen → Destino):</strong></div>
          <div class="col-6 text-end text-dark fw-semibold" id="lblComprobanteRuta">-</div>

          <div class="col-6"><strong>Fecha y Hora:</strong></div>
          <div class="col-6 text-end text-dark fw-semibold" id="lblComprobanteFechaHora">-</div>

          <div class="col-6"><strong>Método de Pago:</strong></div>
          <div class="col-6 text-end text-dark fw-semibold" id="lblComprobanteMetodo">-</div>

          <div class="col-6"><strong>Monto Total:</strong></div>
          <div class="col-6 text-end text-success fw-bold fs-5" id="lblComprobanteTotal">S/ 0.00</div>
        </div>
      </div>
      <div class="modal-footer bg-light justify-content-center">
        <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Aceptar</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
