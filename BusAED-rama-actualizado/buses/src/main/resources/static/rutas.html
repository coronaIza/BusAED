<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Rutas</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 10px; }
        form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        input, select, button { padding: 6px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #999; padding: 6px; text-align: left; }
        th { background: #eee; }
        #mensaje { min-height: 22px; font-weight: bold; }
        .ok { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <header style="display:flex; align-items:center; justify-content:space-between; gap:16px">
        <h1>Gestión de Rutas</h1>
        <button id="btnSalir" type="button">Cerrar sesión</button>
    </header>

    <p><a href="/index.html">Buses</a> | <a href="/rutas.html">Rutas</a> | <a href="/viajes.html">Viajes</a></p>

    <!-- Aquí se muestra la respuesta del backend (éxito o error) -->
    <p id="mensaje"></p>

    <!-- Formulario: sirve para REGISTRAR (POST) y para EDITAR (PUT) -->
    <form id="formulario">
        <input type="hidden" id="id">
        <input type="text" id="origen" placeholder="Origen (Lima)" maxlength="100" required>
        <input type="text" id="destino" placeholder="Destino (Ica)" maxlength="100" required>
        <input type="number" id="precio" placeholder="Precio base (S/)" min="0" step="0.01" required>
        <input type="text" id="duracion" placeholder="Duración (4 horas)" maxlength="50">
        <button type="submit" id="btnGuardar">Registrar ruta</button>
        <button type="button" id="btnCancelar" hidden>Cancelar edición</button>
    </form>

    <!-- Tabla: se llena con los datos reales que devuelve GET /api/rutas -->
    <table>
        <thead>
            <tr><th>ID</th><th>Origen</th><th>Destino</th><th>Precio base</th><th>Duración</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>

    <script>
        document.getElementById("btnSalir").addEventListener("click", async function () {
            try {
                const csrfRespuesta = await fetch("/api/auth/csrf");
                if (!csrfRespuesta.ok) {
                    throw new Error("No se pudo validar la sesión");
                }
                const csrf = await csrfRespuesta.json();
                const respuesta = await fetch("/api/auth/logout", {
                    method: "POST",
                    headers: { "X-XSRF-TOKEN": csrf.token }
                });
                if (!respuesta.ok) {
                    throw new Error("No se pudo cerrar la sesión");
                }
                window.location.assign("/login.html");
            } catch (error) {
                mostrarMensaje(error.message || "No se pudo cerrar la sesión", true);
            }
        });
    </script>
    <script src="/rutas.js"></script>
</body>
</html>
