:root{--yl-red:#dc1727;--yl-navy:#232837;--yl-ink:#28282c;--yl-muted:#68656a;--yl-line:#e9e5e2;--bs-primary:#dc1727;--bs-primary-rgb:220,23,39;--bs-body-font-family:"DM Sans",Arial,sans-serif;--bs-body-color:#28282c;--bs-body-bg:#faf8f5}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:28px}
body{font-family:"DM Sans",Arial,sans-serif;font-weight:400;background:#faf8f5!important;color:var(--yl-ink);line-height:1.55;margin:0}
h1,h2,h3,h4,h5,h6,.fw-bold,.fw-semibold,strong,b{font-weight:600!important}
h1{font-size:clamp(2rem,4vw,3.5rem);letter-spacing:-.045em;line-height:1.1}
h2{font-size:clamp(1.6rem,2.8vw,2.2rem);letter-spacing:-.035em}
h5{font-size:1.03rem;letter-spacing:-.01em}
a{color:#b41121}
input,select,textarea,button{font:inherit}
:focus-visible{outline:3px solid #397bbc;outline-offset:3px}
.yl-logo{width:145px;max-width:100%;height:auto;display:block}
.yl-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.15em;color:#b41121;font-weight:500;margin:0 0 9px}
.yl-caption{font-size:.88rem;color:var(--yl-muted)}
.yl-footer{padding:26px 20px;margin-top:45px;text-align:center;border-top:1px solid var(--yl-line);font-size:.8rem;color:var(--yl-muted)}
body>.navbar{background:#fff!important;border-bottom:1px solid var(--yl-line);box-shadow:none!important;padding:14px 0}
.navbar .navbar-brand{margin-right:25px}
.navbar #saludo{color:var(--yl-ink)!important;font-size:.85rem}
.navbar .btn-outline-light{color:#45414a;border-color:#d8d3d1;border-radius:8px}
.navbar .btn-outline-light:hover{background:#f1ecea}
.navbar-toggler{border-color:#d8d3d1}
.navbar-toggler-icon{filter:invert(1)}
.nav-tabs{border:0;gap:8px;padding:9px;background:#fff;border-radius:12px;box-shadow:0 3px 16px #39252105}
.nav-tabs .nav-link{border:0;border-radius:8px;color:#57535b;font-weight:500}
.nav-tabs .nav-link.active{background:#fae8e7;color:#ab1020}
.card{border:1px solid var(--yl-line)!important;border-radius:14px;box-shadow:0 5px 20px #30222606!important;overflow:hidden}
.card-body{padding:22px}
.card-header{padding:15px 21px;border-bottom:1px solid var(--yl-line);font-weight:500}
.card-header.bg-primary,.card-header.bg-dark,.card-header.bg-success{background:#262b3a!important;color:white!important}
.form-control,.form-select{border-color:#ddd7d3;border-radius:8px;font-size:.9rem;min-height:43px;background-color:#fff}
.form-control:focus,.form-select:focus{border-color:#d97980;box-shadow:0 0 0 3px #dc172715}
.form-label,label{font-weight:500;font-size:.84rem;color:#4d4850}
.btn{font-weight:500;font-size:.87rem;border-radius:8px;padding:9px 14px;transition:background .18s,box-shadow .18s}
.btn-sm{padding:6px 10px;font-size:.78rem}
.btn-primary{--bs-btn-bg:#dc1727;--bs-btn-border-color:#dc1727;--bs-btn-hover-bg:#b21120;--bs-btn-hover-border-color:#b21120;--bs-btn-active-bg:#97101c;--bs-btn-active-border-color:#97101c;--bs-btn-disabled-bg:#dc1727;--bs-btn-disabled-border-color:#dc1727}
.btn-outline-primary{--bs-btn-color:#b41121;--bs-btn-border-color:#d17d84;--bs-btn-hover-bg:#b41121;--bs-btn-hover-border-color:#b41121;--bs-btn-active-bg:#b41121}
.table{font-size:.86rem;--bs-table-bg:transparent}
.table>:not(caption)>*>*{padding:12px 10px;border-color:#eee9e6}
.table th{font-size:.76rem;font-weight:500;text-transform:uppercase;letter-spacing:.035em;background:#f5f3f1!important;color:#605a61!important;white-space:nowrap}
.table tbody td{vertical-align:middle}
.table .btn{margin:2px}
.badge{font-weight:500!important;padding:6px 9px;border-radius:6px}
.alert{border-radius:9px;font-size:.9rem}
.hover-effect:hover{transform:translateY(-2px);box-shadow:0 7px 24px #30222612!important}
.yl-heading{margin:28px 0 22px}
.yl-hero{position:relative;border-radius:18px;overflow:hidden;isolation:isolate;background:#302c2c;color:white;padding:48px 35px;margin-bottom:26px;min-height:310px;display:flex;align-items:center}
.yl-hero:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#15131ae8 0%,#15131a8a 48%,#15131a08),var(--yl-hero-image) center 57%/cover}
.yl-hero .yl-label{color:#ffb6ba}
.yl-hero h1{max-width:490px;margin:0 0 13px}
.yl-hero p:not(.yl-label){max-width:420px;color:#f0e8e7}
.yl-hero .btn{margin-top:9px}
.yl-destinations{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:30px}
.yl-place{min-width:0;margin:0}
.yl-place>div{height:180px;position:relative;overflow:hidden;border-radius:13px}
.yl-place img{width:100%;height:100%;object-fit:cover}
.yl-place h3{position:absolute;bottom:0;left:0;right:0;margin:0;padding:35px 17px 14px;color:white;font-size:1.5rem;background:linear-gradient(transparent,#17151ad9)}
.yl-place figcaption{font-size:.68rem;padding:8px 3px;color:#6a656b}
.yl-place figcaption a{color:inherit}
.yl-auth{max-width:none;margin:0;padding:0;min-height:100vh;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(360px,1fr)}
.yl-auth .yl-auth-art{background:linear-gradient(0deg,#19151ad9,#19151a30),var(--yl-hero-image) 65% center/cover;min-height:100vh;padding:55px;display:flex;align-items:end;color:white}
.yl-auth-art h2{font-size:clamp(2.2rem,4vw,4rem);max-width:530px;line-height:1.1}
.yl-auth-art p{max-width:350px;color:#ece3e1}
.yl-auth main{width:min(450px,calc(100% - 60px));justify-self:center;align-self:center;padding:35px 0;border:0;box-shadow:none;margin:30px 0}
.yl-auth main .yl-logo{margin-bottom:36px;width:175px}
.yl-auth h1{font-size:2.15rem;margin:0 0 15px}
.yl-auth label{display:block;margin:15px 0 6px}
.yl-auth input{display:block;width:100%;padding:11px 12px;border:1px solid #dcd6d2;border-radius:8px;background:white}
.yl-auth button{width:100%;padding:12px;background:#dc1727;color:white;border:0;border-radius:8px;margin:22px 0;font-weight:500;cursor:pointer}
.yl-auth #mensaje{color:#b41121;min-height:22px}
.yl-auth main>p{font-size:.9rem}
.yl-auth a{text-underline-offset:3px}
.yl-bus-frame{width:max-content;max-width:100%;margin:20px auto;padding:18px 14px;border:2px solid #d7d2cf;border-radius:40px 40px 18px 18px;background:#f8f6f3}
.yl-cab{display:flex;justify-content:space-between;gap:25px;border-bottom:1px solid #dcd5d1;padding:4px 9px 18px;margin-bottom:15px;font-size:.77rem;color:#6c6263}
#grillaAsientos,#mapaAsientos{display:grid!important;grid-template-columns:42px 42px 26px 42px 42px!important;gap:8px!important;justify-content:center!important}
#grillaAsientos>.asiento:nth-child(4n+1),#mapaAsientos>.asiento-t:nth-child(4n+1){grid-column:1}
#grillaAsientos>.asiento:nth-child(4n+2),#mapaAsientos>.asiento-t:nth-child(4n+2){grid-column:2}
#grillaAsientos>.asiento:nth-child(4n+3),#mapaAsientos>.asiento-t:nth-child(4n+3){grid-column:4}
#grillaAsientos>.asiento:nth-child(4n),#mapaAsientos>.asiento-t:nth-child(4n){grid-column:5}
#grillaAsientos>.asiento,#mapaAsientos>.asiento-t{width:42px;height:39px;padding:0;border:1px solid #9bc8b9;border-bottom:5px solid #9bc8b9;border-radius:7px;background:#e2f2ea;color:#225c46;font-weight:500;font-size:.8rem}
#grillaAsientos>.asiento.ocupado,#mapaAsientos>.asiento-t.ocupado{background:#e8e4e2;border-color:#cdc5c1;color:#706765;opacity:1}
#grillaAsientos>.asiento.seleccionado,#mapaAsientos>.asiento-t.seleccionado{background:#dc1727;border-color:#a50b18;color:white;box-shadow:0 0 0 2px #dc172719}
#grillaAsientos>.asiento.bloqueado{background:#343a40;color:white;border-color:#232837}
.yl-seat-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:#6b6263;margin-top:14px}
.yl-seat-legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:#9bc8b9;margin-right:5px}
.yl-seat-legend span:nth-child(2):before{background:#cdc5c1}
.yl-seat-legend span:nth-child(3):before{background:#dc1727}
.yl-actions{display:flex;gap:12px;margin:20px 0}
.yl-actions a{flex:1;padding:18px;border:1px solid #e5ddda;background:white;border-radius:12px;color:#302c34;text-decoration:none;font-weight:500}
.yl-actions a:hover{border-color:#dc1727}
.yl-actions i{color:#dc1727;margin-right:9px}
.yl-admin{padding-left:240px}
.yl-admin>nav.navbar{position:fixed;inset:0 auto 0 0;width:220px;display:block;background:#232837!important;padding:28px 16px;z-index:1020}
.yl-admin>nav .container,.yl-admin>nav .container-fluid{display:block;padding:0}
.yl-admin>nav .navbar-brand{display:block;margin:0 0 35px;background:white;border-radius:9px;padding:12px}
.yl-admin>nav .navbar-collapse{display:flex!important;flex-direction:column;align-items:stretch!important}
.yl-admin>nav .navbar-nav{flex-direction:column!important;width:100%;gap:7px}
.yl-admin>nav .nav-link{padding:11px 14px!important;border-radius:8px;color:#dedfe6;font-size:.9rem}
.yl-admin>nav .nav-link.active{background:#dc1727;color:white}
.yl-admin>nav #btnCerrarSesion{margin-top:35px;color:#dedfe6;border-color:#555866}
.yl-admin>nav .navbar-toggler{display:none}
.yl-admin>div.container,.yl-admin>div.container-fluid{max-width:1500px;padding:36px 28px!important;margin:0!important}
.yl-admin .card.text-white h3{font-size:1.8rem;font-weight:500!important}
@media(max-width:991px){.yl-admin{padding-left:0}.yl-admin>nav.navbar{position:relative;inset:auto;width:auto;padding:15px}.yl-admin>nav .navbar-brand{width:150px;margin-bottom:10px}.yl-admin>nav .navbar-nav{flex-direction:row!important;flex-wrap:wrap;gap:4px}.yl-admin>nav #btnCerrarSesion{margin-top:12px;align-self:start}.yl-admin>div.container,.yl-admin>div.container-fluid{padding:25px 16px!important}.yl-auth .yl-auth-art{padding:30px}}
@media(max-width:700px){.yl-auth{grid-template-columns:1fr}.yl-auth .yl-auth-art{min-height:260px;padding:30px 22px;background-position:center 65%}.yl-auth-art h2{font-size:2.2rem;max-width:290px}.yl-auth main{margin:15px 0;width:calc(100% - 44px)}.yl-auth main .yl-logo{margin-bottom:20px}.yl-destinations{grid-template-columns:1fr}.yl-place>div{height:200px}.yl-hero{padding:30px 22px;min-height:300px}.yl-hero h1{font-size:2.4rem}.yl-hero p:not(.yl-label){max-width:245px}.yl-actions{flex-wrap:wrap}.yl-actions a{flex-basis:100%}.card-body{padding:16px}.navbar #saludo{max-width:110px}.navbar-brand{margin-right:6px!important}.yl-logo{width:125px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<div class="container">
    <p class="yl-label">YALEMZ / ADMINISTRACIÓN</p><h2 class="fw-bold mb-4">Gestión de Rutas</h2>
    <p id="mensaje" role="status" class="text-center"></p>

    <div class="row">
        <!-- Formulario -->
        <div class="col-md-4 mb-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Registrar / Editar Ruta</h5>
                </div>
                <div class="card-body">
                    <form id="formulario">
                        <input type="hidden" id="id">
                        <div class="mb-3">
                            <label class="form-label" for="origen">Origen</label>
                            <input type="text" id="origen" class="form-control" placeholder="Ej. Lima" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="destino">Destino</label>
                            <input type="text" id="destino" class="form-control" placeholder="Ej. Ica" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="precio">Precio Base (S/)</label>
                            <input type="number" step="0.01" id="precio" class="form-control" placeholder="0.00" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="duracion">Duración Estimada (Horas)</label>
                            <input type="number" step="0.1" id="duracion" class="form-control" placeholder="Ej. 4.5" required>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" id="btnGuardar" class="btn btn-success w-100">Guardar Ruta</button>
                            <button type="button" id="btnCancelar" class="btn btn-secondary w-100" hidden>Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tabla -->
        <div class="col-md-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
