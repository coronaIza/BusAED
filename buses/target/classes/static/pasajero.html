<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Viajes disponibles | Agencia de buses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/pasajero.html"><i class="bi bi-bus-front"></i> Portal del Pasajero</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuCliente"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menuCliente">
      <div class="ms-auto d-flex align-items-center gap-2">
        <span id="saludo" class="text-white fw-bold"></span>
        <button class="btn btn-outline-light btn-sm" id="btnSalir"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
      </div>
    </div>
  </div>
</nav>
<main class="container my-4">
  <ul class="nav nav-tabs mb-4" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-tab="disponibles"><i class="bi bi-calendar-event"></i> Viajes disponibles</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="reservas">Mis reservas</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="historial">Historial</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="comprobantes">Comprobantes</button></li>
  </ul>
  <div id="mensaje" class="alert d-none" role="status" aria-live="polite"></div>
  <section id="panel-disponibles">
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body row g-3">
        <div class="col-md-3"><label class="form-label">Origen</label><input id="buscarOrigen" class="form-control" placeholder="Origen"></div>
        <div class="col-md-3"><label class="form-label">Destino</label><input id="buscarDestino" class="form-control" placeholder="Destino"></div>
        <div class="col-md-2"><label class="form-label">Fecha</label><input id="buscarFecha" type="date" class="form-control"></div>
        <div class="col-md-2"><label class="form-label">Horario</label><select id="filtroHorario" class="form-select"><option value="">Todos</option><option value="mañana">Mañana</option><option value="tarde">Tarde</option><option value="noche">Noche</option></select></div>
        <div class="col-md-2"><label class="form-label">Ordenar precio</label><select id="filtroPrecio" class="form-select"><option value="">Sin ordenar</option><option value="asc">Menor a mayor</option><option value="desc">Mayor a menor</option></select></div>
      </div>
    </div>
    <div id="tarjetasViajes" class="row g-4"></div>
  </section>
  <section id="panel-reservas" class="d-none"></section>
  <section id="panel-historial" class="d-none"></section>
  <section id="panel-comprobantes" class="d-none"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/pasajero.js"></script>
</body>
</html>
