<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Personal | Agencia de Buses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Menú de Navegación del Administrador -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/index.html">AgenciaBus Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/index.html">Buses</a></li>
                    <li class="nav-item"><a class="nav-link" href="/rutas.html">Rutas</a></li>
                    <li class="nav-item"><a class="nav-link" href="/viajes.html">Viajes</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/personal.html">Personal</a></li>
                </ul>
                <button class="btn btn-outline-light btn-sm" id="btnCerrarSesion">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="fw-bold mb-4">Gestión de Personal</h2>

        <div class="row">
            <!-- Formulario de Registro -->
            <div class="col-md-4 mb-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Registrar Empleado</h5>
                    </div>
                    <div class="card-body">
                        <form id="formularioPersonal">
                            <div class="mb-3">
                                <label class="form-label">Nombre Completo</label>
                                <input type="text" id="nombre" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Correo Electrónico</label>
                                <input type="email" id="email" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" id="password" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Rol del Sistema</label>
                                <select id="rol" class="form-select" required>
                                    <option value="" disabled selected>Seleccione un rol...</option>
                                    <option value="CHOFER">Chofer</option>
                                    <option value="TAQUILLERO">Recepcionista / Taquillero</option>
                                    <option value="ADMIN">Administrador</option>
                                </select>
                            </div>
                            <!-- Contenedor dinámico exclusivo para Choferes (Oculto por defecto) -->
                            <div id="camposChofer" style="display: none;" class="p-3 mb-3 bg-light border rounded">
                                <h6 class="text-primary border-bottom pb-2"><i class="bi bi-truck"></i> Datos Específicos del Chofer</h6>
                                <div class="mb-2">
                                    <label class="form-label text-muted small">Apellidos Completos</label>
                                    <input type="text" id="apellidos" class="form-control form-control-sm">
                                </div>
                                <div class="mb-2">
                                    <label class="form-label text-muted small">Número de Licencia</label>
                                    <input type="text" id="licencia" class="form-control form-control-sm">
                                </div>
                                <div class="mb-2">
                                    <label class="form-label text-muted small">Teléfono</label>
                                    <input type="text" id="telefono" class="form-control form-control-sm">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Crear Cuenta</button>
                            <div id="mensajeAlerta" class="mt-3"></div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla de Personal -->
            <div class="col-md-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Correo</th>
                                        <th>Rol</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaPersonal">
                                    <!-- Aquí se inyectará el personal desde JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/personal.js"></script>
</body>
</html>
