<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Chofer | Agencia de Buses</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-bus-front"></i> Portal del Conductor</a>
            <button class="btn btn-outline-light btn-sm" id="btnCerrarSesion">
                <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
            </button>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col">
                <h2 class="fw-bold">Mis Tareas Asignadas</h2>
                <p class="text-muted">Selecciona una acción para gestionar tu ruta actual.</p>
            </div>
        </div>

        <div class="row g-4">
            <!-- Consultar Ruta -->
            <div class="col-md-6 col-lg-3">
                <div class="card h-100 border-0 shadow-sm text-center p-4 hover-effect">
                    <i class="bi bi-map text-primary fs-1 mb-3"></i>
                    <h5 class="card-title">Consultar Hoja de Ruta</h5>
                    <button class="btn btn-primary mt-auto w-100">Ver Detalles</button>
                </div>
            </div>
            
            <!-- Validar Abordaje -->
            <div class="col-md-6 col-lg-3">
                <div class="card h-100 border-0 shadow-sm text-center p-4">
                    <i class="bi bi-person-check text-success fs-1 mb-3"></i>
                    <h5 class="card-title">Validar Pasajeros</h5>
                    <button class="btn btn-success mt-auto w-100">Iniciar Revisión</button>
                </div>
            </div>

            <!-- Registro Viaje -->
            <div class="col-md-6 col-lg-3">
                <div class="card h-100 border-0 shadow-sm text-center p-4">
                    <i class="bi bi-clock-history text-info fs-1 mb-3"></i>
                    <h5 class="card-title">Registro de Viaje</h5>
                    <button class="btn btn-info text-white mt-auto w-100">Marcar Inicio/Fin</button>
                </div>
            </div>

            <!-- Reportar Incidencia -->
            <div class="col-md-6 col-lg-3">
                <div class="card h-100 border-0 shadow-sm text-center p-4">
                    <i class="bi bi-exclamation-triangle text-danger fs-1 mb-3"></i>
                    <h5 class="card-title">Reportar Incidencia</h5>
                    <button class="btn btn-danger mt-auto w-100">Crear Reporte</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('btnCerrarSesion').addEventListener('click', () => {
            sessionStorage.removeItem('token');
            window.location.href = '/login.html';
        });
    </script>
    <style>
        .card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important; }
    </style>
</body>
</html>
