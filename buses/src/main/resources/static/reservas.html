<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas de pasajes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        #grillaAsientos { display:grid; grid-template-columns:repeat(10,38px); gap:6px; justify-content:start; }
        .asiento { width:38px; height:34px; padding:0; border-radius:6px; border:1px solid #b7c8d6; background:#eaf6ea; color:#1d5a2d; }
        .asiento.ocupado { background:#dc3545; color:white; cursor:not-allowed; }
        .asiento.seleccionado { background:#0d6efd; color:white; box-shadow:0 0 0 3px rgba(13,110,253,.2); }
        .asiento.bloqueado { background:#343a40; color:white; cursor:not-allowed; }
        .pasillo, .puerta { display:none; }
        @media(max-width:576px) { #grillaAsientos { grid-template-columns:repeat(5,38px); } }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary shadow-sm">
      <div class="container"><a class="navbar-brand fw-bold" href="/pasajero.html"><i class="bi bi-bus-front"></i> Reserva de pasajes</a><button id="btnSalir" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button></div>
    </nav>
    <main class="container my-4">
      <div id="mensaje" class="alert d-none" role="status" aria-live="polite"></div>
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body row g-3 align-items-end">
          <div class="col-lg-8"><label class="form-label fw-bold" for="viaje">Viaje</label><select id="viaje" class="form-select"></select></div>
            <div class="col-lg-4"><a href="/pasajero.html" class="btn btn-outline-primary w-100"><i class="bi bi-arrow-left"></i> Volver a viajes disponibles</a></div>
        </div>
      </div>
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <div class="d-flex flex-wrap gap-3 mb-3 small">
                <span><i class="bi bi-square-fill text-success"></i> Disponible</span><span><i class="bi bi-square-fill text-danger"></i> Ocupado</span><span><i class="bi bi-square-fill text-primary"></i> Seleccionado</span><span><i class="bi bi-square-fill text-dark"></i> Bloqueado</span>
              </div>
              <div id="grillaAsientos"></div>
            </div>
          </div>
        </div>
        <aside class="col-lg-4">
          <div class="card border-0 shadow-sm sticky-lg-top">
            <div class="card-header bg-dark text-white"><i class="bi bi-receipt"></i> Resumen de reserva</div>
            <div class="card-body">
              <p id="detalleViaje">Selecciona un viaje.</p>
              <p>Asiento: <strong id="asientoSeleccionado">Ninguno</strong></p>
              <button id="btnReservar" class="btn btn-primary w-100" disabled><i class="bi bi-check2-circle"></i> Confirmar reserva</button>
            </div>
          </div>
        </aside>
      </div>
      <h2 class="fw-bold mt-5 mb-3">Mis reservas</h2>
      <div id="tablaReservas" class="row g-3"></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/reservas.js"></script>
</body>
</html>
