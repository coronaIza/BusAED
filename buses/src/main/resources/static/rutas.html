<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Rutas | Agencia de Buses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/index.html"><i class="bi bi-bus-front"></i> AgenciaBus Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/index.html">Buses</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/rutas.html">Rutas</a></li>
                    <li class="nav-item"><a class="nav-link" href="/viajes.html">Viajes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/personal.html">Personal</a></li>
                </ul>
                <button class="btn btn-outline-light btn-sm" id="btnCerrarSesion">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="fw-bold mb-4">Gestión de Rutas</h2>
        <p id="mensaje" role="status" class="text-center"></p>

        <div class="row">
            <!-- Formulario -->
            <div class="col-md-4 mb-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Registrar / Editar Ruta</h5>
                    </div>
                    <div class="card-body">
                        <form id="formulario">
                            <input type="hidden" id="id">
                            <div class="mb-3">
                                <label class="form-label">Origen</label>
                                <input type="text" id="origen" class="form-control" placeholder="Ej. Lima" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Destino</label>
                                <input type="text" id="destino" class="form-control" placeholder="Ej. Ica" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Precio Base (S/)</label>
                                <input type="number" step="0.01" id="precio" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Duración Estimada (Horas)</label>
                                <input type="number" step="0.1" id="duracion" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Guardar Ruta</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla -->
            <div class="col-md-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Origen</th>
                                        <th>Destino</th>
                                        <th>Precio</th>
                                        <th>Duración</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/rutas.js"></script>
    <script>
        document.getElementById('btnCerrarSesion').addEventListener('click', () => {
            sessionStorage.removeItem('token');
            window.location.href = '/login.html';
        });
    </script>
</body>
</html>
